name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Slå ikke igennem en igangværende deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Konfigurer Pages
        uses: actions/configure-pages@v5

      - name: Saml sidens filer
        run: |
          mkdir -p "${{ runner.temp }}/site"
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'README.md' \
            --exclude 'flake.nix' \
            --exclude 'module.nix' \
            ./ "${{ runner.temp }}/site/"

      - name: Sørg for læse-rettigheder
        run: chmod -c -R +rX "${{ runner.temp }}/site"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site"

      - name: Deploy til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
