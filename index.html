<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>Indlæser…</title>

<!--
  INDGANGEN
  index.html er ikke en side i sig selv. Den henter den side, der passer til
  tidspunktet, og viser den — URL'en ændrer sig aldrig.
  Rækkefølgen og tidspunkterne ligger i site.js.
-->
<script src="site.js?v=1"></script>

<style>
  :root {
    --bg: #000;
    --fg: #f2f2f2;
    --muted: #8a8a8a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; background: var(--bg); color: var(--fg);
    font-family: ui-rounded, "Nunito", "Trebuchet MS", system-ui, sans-serif;
  }
  #app { min-height: 100vh; }

  /* Spinneren, mens siden hentes */
  .spinner-wrap { min-height: 100vh; display: grid; place-items: center; }
  .spinner {
    width: 56px; height: 56px; margin: 0 auto;
    border: 3px solid #262626; border-top-color: var(--fg);
    border-radius: 50%; animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .label {
    margin: 22px 0 0; text-align: center; font-size: .8rem; font-weight: 800;
    letter-spacing: .3em; text-transform: uppercase; color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; border-top-color: var(--muted); }
  }
</style>
</head>
<body>

<div id="app">
  <div class="spinner-wrap">
    <div>
      <div class="spinner" role="status" aria-label="Indlæser"></div>
      <p class="label">Indlæser</p>
    </div>
  </div>
</div>

<script>
// Vis den side, der passer til tidspunktet — uden at URL'en ændrer sig
(async () => {
  await showPage(SITE.current().file);
})();
</script>
</body>
</html>
